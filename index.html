<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="canonical" href="https://thimagroo.vercel.app/">

<title>Thimagroo — links, redes sociais e contato comercial</title>
<meta name="description" content="Todos os links do Thimagroo em um lugar só: lives de IRL na Twitch, vídeos no YouTube, TikTok e Instagram, Discord da comunidade e contato para marcas.">
<meta name="author" content="Thiago Bertoncello">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#0E0C0B">

<meta property="og:type" content="profile">
<meta property="og:url" content="https://thimagroo.vercel.app/">
<meta property="og:site_name" content="Thimagroo">
<meta property="og:title" content="Thimagroo — links, redes sociais e contato comercial">
<meta property="og:description" content="Lives de IRL na Twitch, vídeos no YouTube, TikTok e Instagram. Mais de 300 milhões de visualizações nos últimos 6 meses.">
<meta property="og:image" content="https://thimagroo.vercel.app/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Thimagroo — streamer de IRL na Twitch">
<meta property="og:locale" content="pt_BR">
<meta property="og:locale:alternate" content="en_US">
<meta property="profile:username" content="thimagroo">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Thimagroo — links, redes sociais e contato comercial">
<meta name="twitter:description" content="Lives de IRL na Twitch, vídeos no YouTube, TikTok e Instagram. Mais de 300 milhões de visualizações nos últimos 6 meses.">
<meta name="twitter:image" content="https://thimagroo.vercel.app/assets/img/og.png">

<link rel="icon" href="assets/img/avatar.jpg">
<link rel="apple-touch-icon" href="assets/img/avatar.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="topline" aria-hidden="true"><i id="progress"></i></div>

<div class="wrap">
  <section class="hero">
    <div class="avatar"><img id="avatar" alt="" width="96" height="96"></div>

    <div class="status" id="status" hidden>
      <span class="dot"></span><span id="statusText"></span>
    </div>

    <h1 id="displayName">Thimagroo</h1>
    <p class="tagline" id="tagline">Lives de IRL na Twitch e vídeos no YouTube, TikTok e Instagram. Mais de 300 milhões de visualizações nos últimos 6 meses.</p>

    <div class="seg seg--lang" id="langSwitch" role="group" hidden></div>

    <div class="cta-row" id="ctaRow"></div>
  </section>
</div>

<main>
  <section class="section wrap" id="links">
    <div class="section-head"><h2 class="eyebrow" data-ui="links.title"></h2></div>
    <div id="linkGroups"></div>
  </section>

  <section class="section wrap" id="numbers" hidden>
    <div class="section-head"><h2 class="eyebrow" data-ui="proof.title"></h2></div>
    <div class="proof">
      <div class="proof-head">
        <span class="eyebrow" id="statsPeriod"></span>
      </div>
      <div class="proof-grid" id="statsGrid"></div>
      <p class="proof-foot" id="statsSource"></p>
    </div>
  </section>

  <section class="section wrap" id="offer" hidden>
    <div class="section-head"><h2 class="eyebrow" data-ui="offer.title"></h2></div>
    <div class="formats" id="formats"></div>
    <div id="partnersBlock" hidden>
      <span class="eyebrow eyebrow--spaced" data-ui="offer.partners"></span>
      <div class="partners" id="partners"></div>
    </div>
  </section>

  <section class="section wrap" id="contact">
    <div class="contact-card">
      <span class="eyebrow" id="contactTitle"></span>
      <h2 id="contactHeadline"></h2>
      <p id="contactBody"></p>
      <div class="mailrow" id="contactActions"></div>
      <div class="copy-slot"><span class="copy-ok" id="copyOk" data-ui="contact.copied"></span></div>
    </div>
  </section>
</main>

<div class="wrap">
  <footer><span id="footerText"></span></footer>
</div>

<script src="config/theme.js"></script>
<script src="config/platforms.js"></script>
<script src="config/i18n.js"></script>
<script src="config/profile.js"></script>
<script src="assets/js/background.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
